<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>笺 · 合成测试控制台</title>
<style>body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px;color:#253041}button,select{font:inherit;margin:5px;padding:8px 12px}pre{white-space:pre-wrap;background:#f4f6f8;padding:14px;border-radius:8px;font-size:13px}#status{padding:12px;background:#e9f5ef}</style>
</head><body>
<h1>合成浏览器测试控制台</h1>
<p>只操作本次本地测试页面；翻译、剪贴板与文件均为合成数据。</p>
<label>响应场景 <select id="scenario">
<option value="hold">挂起，手动结束</option><option value="normal">正常结束</option><option value="length">令牌截断</option>
<option value="error">SSE 错误事件</option><option value="eof">未正常结束即 EOF</option><option value="crlf">CRLF 响应</option>
<option value="empty">正常结束但正文为空</option>
<option value="tail">无换行结束帧</option><option value="import-hold">文件读取挂起</option>
<option value="clipboard-hold">图片剪贴板读取挂起</option><option value="clipboard-image">合成图片剪贴板</option>
</select></label>
<button id="apply">应用场景</button><button id="finish">完成挂起请求</button><button id="fail">截断挂起请求</button>
<button id="release-file">释放文件读取</button><button id="release-clipboard">释放剪贴板读取</button>
<button id="selection">投递同一划词请求</button>
<p id="status" role="status">等待测试页面</p>
<p>请求数：<strong id="count">0</strong>，未完成：<strong id="active">0</strong>，页面异常：<strong id="errors">0</strong></p>
<pre id="report" aria-label="合成测试事件"></pre>
<script>
const channel = new BroadcastChannel('jian-internal-browser-audit');
const events = [], active = new Set(); let count = 0, errors = 0;
function send(type, value) { channel.postMessage({type,value}); }
document.getElementById('apply').onclick = () => send('scenario', document.getElementById('scenario').value);
document.getElementById('finish').onclick = () => send('finish','stop');
document.getElementById('fail').onclick = () => send('finish','length');
document.getElementById('release-file').onclick = () => send('release-file');
document.getElementById('release-clipboard').onclick = () => send('release-clipboard');
document.getElementById('selection').onclick = () => send('native-selection', 1);
channel.onmessage = ({data}) => {
  events.push(data);
  if (data.type === 'request') { count++; active.add(data.detail.id); }
  if (['completed','reader-cancelled','aborted'].includes(data.type)) active.delete(data.detail.id);
  if (['page-error','page-rejection','blocked-external'].includes(data.type)) errors++;
  if (data.type === 'scenario-ready') document.getElementById('status').textContent = '已应用：' + data.detail.scenario;
  document.getElementById('count').textContent = count;
  document.getElementById('active').textContent = active.size;
  document.getElementById('errors').textContent = errors;
  document.getElementById('report').textContent = JSON.stringify(events.slice(-30),null,2);
};
send('ping');
</script></body></html>
