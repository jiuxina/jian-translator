plugins {
    id 'com.android.application'
}

def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('signing.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    releaseSigning.getProperty(it)?.trim()
}
if (providers.gradleProperty('requireReleaseSigning').orNull == 'true' && !hasReleaseSigning) {
    throw new GradleException('Release publishing requires a complete signing.properties configuration.')
}

android {
    namespace 'ink.jian.translate'
    compileSdk 35

    defaultConfig {
        applicationId 'ink.jian.translate'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '2.4.2'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // 应用内相机（拍照翻译）：预览 + 拍照 + 生命周期绑定
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}

// 前端只有一份真源：构建时把 ../web 整棵目录同步进 assets，WebView 加载 assets/index.html
def webSourceDir = rootProject.file('../web')
def assetsTargetDir = file('src/main/assets')

tasks.register('syncWebAssets', Copy) {
    from webSourceDir
    into assetsTargetDir
    include 'index.html', 'theme.css', 'app.js', 'langs.js', 'liquid-glass.js', 'updates.js'
    doLast {
        logger.lifecycle("synced ../web -> src/main/assets")
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'syncWebAssets'
}

// CameraX 传递依赖里混了新旧两版 kotlin-stdlib（jdk8 1.6.21 与 stdlib 1.8.22），
// 1.8 起 jdk7/jdk8 已并入 stdlib，统一强制到同一版本避免 duplicate class。
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
