name: Build and publish release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows packages
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    outputs:
      artifact: ${{ steps.paths.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Pake CLI 3.18.0
        shell: pwsh
        env:
          NPM_CONFIG_PREFIX: ${{ github.workspace }}/.build/npm-global
        run: npm install --global pake-cli@3.18.0
      - name: Build portable EXE and MSI installer
        shell: pwsh
        env:
          NPM_CONFIG_PREFIX: ${{ github.workspace }}/.build/npm-global
          IT_OUT_DIR: ${{ github.workspace }}/.build/release-stage/windows
        run: '& "C:\Program Files\Git\usr\bin\bash.exe" app/rebuild.sh'
      - name: Save Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            .build/release-stage/windows/笺.exe
            .build/release-stage/windows/笺.msi
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build macOS packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install macOS shell dependencies
        working-directory: app/macos
        run: npm ci
      - name: Build universal DMG and ZIP
        working-directory: app/macos
        env:
          IT_OUT_DIR: ${{ github.workspace }}/.build/release-stage/macos
        run: npm run build
      - name: Save macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            .build/release-stage/macos/笺-*-macOS-universal.dmg
            .build/release-stage/macos/笺-*-macOS-universal.zip
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Copy web assets into Android project
        shell: pwsh
        run: Copy-Item web/* android/app/src/main/assets/ -Force
      - name: Restore Android release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_SIGNING_PROPERTIES_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 or ANDROID_SIGNING_PROPERTIES_BASE64 is not set; continue with debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/release.keystore
          echo "$ANDROID_SIGNING_PROPERTIES_BASE64" | base64 --decode > android/signing.properties
      - name: Build release APK
        working-directory: android
        run: ./gradlew -g "$GITHUB_WORKSPACE/.build/gradle-home" :app:assembleRelease --console=plain
      - name: Save Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Prepare and publish release
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-package*"
          path: .build/release-input
      - name: Rename APK to release name
        run: mv .build/release-input/android-package/app-release.apk .build/release-input/android-package/笺.apk
      - name: Prepare release bundle
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/prepare-release.mjs --windows-dir .build/release-input/windows-packages --macos-dir .build/release-input/macos-packages --android .build/release-input/android-package/笺.apk --out-dir .build/release-ready --revision "$SOURCE_REVISION"
      - name: List release bundle and hashes
        run: |
          find .build/release-ready -maxdepth 1 -type f -printf '%f\n' | sort
          cat .build/release-ready/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 笺 ${{ github.ref_name }}
          body_path: .build/release-ready/RELEASE_NOTES.md
          files: |
            .build/release-ready/Jian-*-windows-x64.exe
            .build/release-ready/Jian-*-windows-x64.msi
            .build/release-ready/Jian-*-macOS-universal.dmg
            .build/release-ready/Jian-*-macOS-universal.zip
            .build/release-ready/Jian-*-android.apk
            .build/release-ready/SHA256SUMS.txt
          draft: false
          prerelease: true
          generate_release_notes: true
      - name: Save prepared release bundle
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: prepared-release
          path: .build/release-ready/*
          if-no-files-found: error
          retention-days: 7
